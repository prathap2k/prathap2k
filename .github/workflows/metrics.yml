name: Profile visuals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Snake contribution graph ──────────────────────────────────────────────
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: prathap2k
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Org count (number only — no names exposed) ───────────────────────────
  count-orgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count organizations
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          # Paginate /user/orgs so the count is correct even with >100 orgs
          PAGE=1; TOTAL=0
          while true; do
            BATCH=$(curl -s \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/orgs?per_page=100&page=$PAGE" \
              | jq 'length')
            TOTAL=$((TOTAL + BATCH))
            [ "$BATCH" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          echo "Org count: $TOTAL"
          # Write shields.io endpoint JSON — count only, no org names
          jq -n --arg msg "$TOTAL" \
            '{ schemaVersion:1, label:"ORGANIZATIONS", message:$msg, color:"2c5364" }' \
            > org-count.json

      - name: Commit org count
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add org-count.json
          git diff --staged --quiet || git commit -m "Update org count [skip ci]"
          git push

  # ── Aggregated stats (includes private repos, no private details exposed) ─
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT with "All repositories / Contents: Read + Metadata: Read"
          # so the action can see private repos for aggregate counting.
          # Only the rendered SVG is committed; raw data never leaves GitHub.
          token: ${{ secrets.METRICS_TOKEN }}
          user: prathap2k
          template: classic

          # ── Base: header only ───────────────────────────────────────────
          # Shows aggregate totals (commits, PRs, issues, repos contributed
          # to). GitHub tracks private contributions server-side so these
          # counts include private repos — no repo-level access needed.
          # Excludes: activity feed, community orgs, repository list.
          base: header

          # ── Full-year contribution calendar ─────────────────────────────
          # Heatmap of daily contribution counts. No repo names shown.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── Language mix as percentages ──────────────────────────────────
          # Scans all repos (including private) and reports language share.
          # No repo names are included in the output.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, handlebars

          # ── Commit rendered SVG to this repo ────────────────────────────
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: metrics.svg

          config_timezone: America/Chicago
          config_padding: 10
