name: Profile visuals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Snake contribution graph ──────────────────────────────────────────────
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: prathap2k
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Org count (number only — no names exposed) ───────────────────────────
  count-orgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count organizations
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          # Paginate /user/orgs so the count is correct even with >100 orgs
          PAGE=1; TOTAL=0
          while true; do
            BATCH=$(curl -s \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/orgs?per_page=100&page=$PAGE" \
              | jq 'length')
            TOTAL=$((TOTAL + BATCH))
            [ "$BATCH" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          echo "Org count: $TOTAL"
          echo "ORG_TOTAL=$TOTAL" >> "$GITHUB_ENV"

      # main is ruleset-protected (PR-only), so the badge data lives on a
      # dedicated `data` branch. Not `output`: the snake job force-replaces it.
      - name: Commit org count to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin data 2>/dev/null; then
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rfq .
          fi
          # Write shields.io endpoint JSON — count only, no org names
          jq -n --arg msg "$ORG_TOTAL" \
            '{ schemaVersion:1, label:"ORGANIZATIONS", message:$msg, color:"2c5364" }' \
            > org-count.json
          git add org-count.json
          git diff --staged --quiet || git commit -m "Update org count [skip ci]"
          git push origin data
