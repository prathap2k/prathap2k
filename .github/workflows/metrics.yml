name: Profile visuals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Snake contribution graph ──────────────────────────────────────────────
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: prathap2k
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Aggregated stats (includes private repos, no private details exposed) ─
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT with "All repositories / Contents: Read + Metadata: Read"
          # so the action can see private repos for aggregate counting.
          # Only the rendered SVG is committed; raw data never leaves GitHub.
          token: ${{ secrets.METRICS_TOKEN }}
          user: prathap2k
          template: classic

          # ── Base: header only ───────────────────────────────────────────
          # Shows aggregate totals (commits, PRs, issues, repos contributed
          # to) across all repos including private ones.
          # Excludes: activity feed, community orgs, repository list.
          base: header
          base_indepth: yes

          # ── Full-year contribution calendar ─────────────────────────────
          # Heatmap of daily contribution counts. No repo names shown.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── Language mix as percentages ──────────────────────────────────
          # Scans all repos (including private) and reports language share.
          # No repo names are included in the output.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, handlebars

          # ── Commit rendered SVG to this repo ────────────────────────────
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: metrics.svg

          config_timezone: America/Chicago
          config_padding: 10
